<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
<div class="container">
    <div class="header">
        <h1>Tic-Tac-Toe</h1>
        <p class="nRound">Round</p>
    </div>

    <div class="game">
        <div class="player1">
            <div class="symbol-badge">O</div>
            <h2>Player 1</h2>
            <p class="p1score">Score<br><span class="score-value">0</span></p>
        </div>

        <div class="board-wrap">
            <div class="board">
                <div class="cell" id="c0"></div>
                <div class="cell" id="c1"></div>
                <div class="cell" id="c2"></div>
                <div class="cell" id="c3"></div>
                <div class="cell" id="c4"></div>
                <div class="cell" id="c5"></div>
                <div class="cell" id="c6"></div>
                <div class="cell" id="c7"></div>
                <div class="cell" id="c8"></div>
            </div>
        </div>

        <div class="player2">
            <div class="symbol-badge">X</div>
            <h2>Player 2</h2>
            <p class="p2score">Score<br><span class="score-value">0</span></p>
        </div>
    </div>
</div>

<!-- Draw banner -->
<div class="draw-banner" id="draw-banner">🤝 Draw! </div>

<!-- Game winner modal -->
<div class="modal-overlay" id="game-modal">
    <div class="modal-card" id="modal-card">
        <span class="modal-trophy">🏆</span>
        <p class="modal-title" id="modal-title">Player 1 won the game!</p>
        <p class="modal-subtitle">Congratulations!</p>
        <button class="modal-btn" id="modal-btn" onclick="resetGame()">Play again</button>
    </div>
</div>

</body>
</html>
